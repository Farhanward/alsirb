[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alsirb"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Local multi-role agent software factory."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
alsirb = "alsirb.cli:main"

[tool.setuptools]
packages = ["alsirb"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
